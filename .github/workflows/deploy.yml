name: CI/CD Pipeline to AWS EC2

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Build & Test Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

  deploy:
    name: Deploy to AWS EC2 via Appleboy SSH
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Transfer Project Files to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: "."
          target: "~/strew-backend"

      - name: Build Docker Image & Run Container via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            cd ~/strew-backend

            # Inject environment variables into .env file
            cat << 'EOF' > .env
            PORT=8080
            db_user=${{ secrets.DB_USER }}
            password=${{ secrets.DB_PASSWORD }}
            DB_LINK=${{ secrets.DB_LINK }}
            SECRECT_KEY=${{ secrets.SECRECT_KEY }}
            FRONT_END_URL=${{ secrets.FRONT_END_URL }}
            TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
            RAZORPAY_PUBLIC_KEY=${{ secrets.RAZORPAY_PUBLIC_KEY }}
            RAZORPAY_PRIVATE_KEY=${{ secrets.RAZORPAY_PRIVATE_KEY }}
            GOOGLE_APP_USER=${{ secrets.GOOGLE_APP_USER }}
            GOOGLE_APP_PASSWORD=${{ secrets.GOOGLE_APP_PASSWORD }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GOOGLE_CALLBACK_URL=${{ secrets.GOOGLE_CALLBACK_URL }}
            EOF

            # Stop and remove existing container if running
            docker stop strew-backend || true
            docker rm strew-backend || true

            # Build Docker image
            docker build -t strew-backend:latest .

            # Run Docker container
            docker run -d \
              --name strew-backend \
              --restart always \
              -p 8080:8080 \
              --env-file .env \
              strew-backend:latest

            # Clean up dangling images
            docker image prune -f
